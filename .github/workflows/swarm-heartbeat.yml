name: Swarm heartbeat
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: swarm-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Tick the universe
        shell: bash
        run: |
          set -uo pipefail
          code=$(curl -sS --max-time 90 -o /tmp/tick.json -w '%{http_code}' \
            -X POST 'https://base44.app/api/apps/6ae17320e2bf99b777448a91/functions/foundryOps' \
            -H 'Content-Type: application/json' \
            -d '{"action":"tick"}') || code=000
          echo "foundryOps tick -> HTTP $code"
          cat /tmp/tick.json 2>/dev/null || true
          [ "$code" = "200" ]
